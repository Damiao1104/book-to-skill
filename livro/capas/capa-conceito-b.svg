<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 849" width="600" height="849" font-family="'DejaVu Sans', Arial, sans-serif">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1622"/><stop offset="0.6" stop-color="#101f30"/><stop offset="1" stop-color="#13293d"/>
    </linearGradient>
    <linearGradient id="loopL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a085"/><stop offset="1" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="loopR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2980b9"/><stop offset="1" stop-color="#8e44ad"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2980b9" stop-opacity="0.4"/><stop offset="1" stop-color="#2980b9" stop-opacity="0"/>
    </radialGradient>
    <marker id="flow" markerWidth="12" markerHeight="12" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfe0ee"/>
    </marker>
  </defs>

  <rect width="600" height="849" fill="url(#bgB)"/>
  <circle cx="300" cy="330" r="280" fill="url(#glowB)"/>

  <!-- rótulo superior -->
  <text x="300" y="88" text-anchor="middle" fill="#7fa8c9" font-size="14" letter-spacing="5">SEGURANÇA OFENSIVA · DEVSECOPS · IA</text>
  <line x1="150" y1="104" x2="450" y2="104" stroke="#2a4a66" stroke-width="1"/>

  <!-- laço do infinito (dois anéis sobrepostos = ciclo DevOps) -->
  <g fill="none" stroke-width="15" stroke-linecap="round">
    <circle cx="206" cy="320" r="104" stroke="url(#loopL)"/>
    <circle cx="394" cy="320" r="104" stroke="url(#loopR)"/>
  </g>
  <!-- setas de fluxo contínuo -->
  <path d="M206 216 a104 104 0 0 0 -92 56" fill="none" stroke="#16a085" stroke-width="3" marker-end="url(#flow)" opacity="0.9"/>
  <path d="M394 424 a104 104 0 0 0 92 -56" fill="none" stroke="#8e44ad" stroke-width="3" marker-end="url(#flow)" opacity="0.9"/>

  <!-- lobo esquerdo: terminal (Kali / ofensiva) -->
  <g transform="translate(206,320)">
    <rect x="-58" y="-34" width="116" height="70" rx="8" fill="#06131d" stroke="#16a085" stroke-width="1.6"/>
    <rect x="-58" y="-34" width="116" height="16" rx="8" fill="#0e2433"/>
    <circle cx="-48" cy="-26" r="2.6" fill="#16a085"/><circle cx="-39" cy="-26" r="2.6" fill="#2980b9"/><circle cx="-30" cy="-26" r="2.6" fill="#7f8c8d"/>
    <text x="-46" y="14" fill="#16a085" font-family="'DejaVu Sans Mono', monospace" font-size="20" font-weight="bold">&gt;_</text>
    <rect x="-16" y="4" width="40" height="4" fill="#2980b9"/>
  </g>

  <!-- lobo direito: rede neural (IA) -->
  <g transform="translate(394,320)">
    <g stroke="#9b59b6" stroke-width="1.4" opacity="0.85">
      <line x1="-40" y1="-26" x2="-6" y2="0"/><line x1="-40" y1="0" x2="-6" y2="0"/><line x1="-40" y1="26" x2="-6" y2="0"/>
      <line x1="-6" y1="0" x2="34" y2="-24"/><line x1="-6" y1="0" x2="34" y2="0"/><line x1="-6" y1="0" x2="34" y2="24"/>
    </g>
    <g fill="#2980b9">
      <circle cx="-40" cy="-26" r="6"/><circle cx="-40" cy="0" r="6"/><circle cx="-40" cy="26" r="6"/>
    </g>
    <circle cx="-6" cy="0" r="8" fill="#8e44ad"/>
    <g fill="#9b59b6"><circle cx="34" cy="-24" r="6"/><circle cx="34" cy="0" r="6"/><circle cx="34" cy="24" r="6"/></g>
  </g>

  <!-- cruzamento central: escudo + cadeado (o "Sec") -->
  <g transform="translate(300,320)">
    <path d="M0 -56 L44 -40 V8 C44 40 24 60 0 70 C-24 60 -44 40 -44 8 V-40 Z"
          fill="#0d1f2e" stroke="#ecf0f1" stroke-width="2.5"/>
    <rect x="-16" y="-6" width="32" height="26" rx="4" fill="#16a085"/>
    <path d="M-10 -6 V-16 a10 10 0 0 1 20 0 V-6" fill="none" stroke="#ecf0f1" stroke-width="3"/>
    <circle cx="0" cy="5" r="3.5" fill="#06131d"/>
    <rect x="-1.6" y="5" width="3.2" height="9" fill="#06131d"/>
  </g>

  <!-- título -->
  <text x="300" y="512" text-anchor="middle" fill="#7fa8c9" font-size="14" letter-spacing="6">GUIA DEFINITIVO DE</text>
  <text x="300" y="568" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="bold">Kali Linux</text>
  <text x="300" y="612" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="bold">Ethical Hacking</text>
  <text x="300" y="652" text-anchor="middle" fill="#8e44ad" font-size="28" font-weight="bold">&amp; Defesa de IA</text>

  <line x1="160" y1="682" x2="440" y2="682" stroke="url(#loopR)" stroke-width="2"/>
  <text x="300" y="716" text-anchor="middle" fill="#cfe0ee" font-size="14">Do pentest ao MLSecOps — um ciclo contínuo de ataque e defesa</text>
  <text x="300" y="738" text-anchor="middle" fill="#7fa8c9" font-size="12.5">Three-Points · Guardrails · Treino Adversarial · NIST AI RMF · EU AI Act</text>

  <text x="300" y="794" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Damião dos Santos</text>
  <text x="300" y="816" text-anchor="middle" fill="#7fa8c9" font-size="11.5">Analista de Sistemas · Pós em Segurança da Informação e Engenharia de Software</text>
</svg>
