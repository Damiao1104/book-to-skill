<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 849" width="600" height="849" font-family="'DejaVu Sans', Arial, sans-serif">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a12"/><stop offset="0.5" stop-color="#0d1b26"/><stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a085"/><stop offset="0.5" stop-color="#2980b9"/><stop offset="1" stop-color="#8e44ad"/>
    </linearGradient>
  </defs>
  <rect width="600" height="849" fill="url(#bgC)"/>

  <!-- rótulo -->
  <text x="300" y="86" text-anchor="middle" fill="#8aa6b8" font-size="14" letter-spacing="4">A TRÍADE DA SEGURANÇA MODERNA</text>

  <!-- linha de fluxo conectando os três pilares -->
  <line x1="135" y1="300" x2="465" y2="300" stroke="url(#barC)" stroke-width="3"/>
  <polygon points="220,300 236,293 236,307" fill="#2980b9"/>
  <polygon points="380,300 396,293 396,307" fill="#8e44ad"/>

  <!-- Pilar 1: Ofensiva / Kali -->
  <g>
    <rect x="60" y="150" width="150" height="300" rx="14" fill="#0a1a14" stroke="#16a085" stroke-width="2"/>
    <rect x="60" y="150" width="150" height="40" rx="14" fill="#16a085"/>
    <text x="135" y="177" text-anchor="middle" fill="#042018" font-size="14" font-weight="bold">OFENSIVA</text>
    <!-- terminal -->
    <rect x="86" y="222" width="98" height="64" rx="7" fill="#04120c" stroke="#16a085" stroke-width="1.4"/>
    <text x="100" y="262" fill="#16a085" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold">&gt;_</text>
    <rect x="128" y="248" width="34" height="4" fill="#2980b9"/>
    <text x="135" y="330" text-anchor="middle" fill="#cfe9e1" font-size="12.5" font-weight="bold">Kali · Nmap</text>
    <text x="135" y="352" text-anchor="middle" fill="#8aa6b8" font-size="11">Three-Points</text>
    <text x="135" y="372" text-anchor="middle" fill="#8aa6b8" font-size="11">Exploração</text>
    <text x="135" y="392" text-anchor="middle" fill="#8aa6b8" font-size="11">Pós-exploração</text>
  </g>

  <!-- Pilar 2: DevSecOps -->
  <g>
    <rect x="225" y="150" width="150" height="300" rx="14" fill="#0a1522" stroke="#2980b9" stroke-width="2"/>
    <rect x="225" y="150" width="150" height="40" rx="14" fill="#2980b9"/>
    <text x="300" y="177" text-anchor="middle" fill="#04131f" font-size="14" font-weight="bold">DEVSECOPS</text>
    <!-- infinito + cadeado -->
    <g fill="none" stroke="#5aa8d6" stroke-width="7" stroke-linecap="round">
      <circle cx="283" cy="250" r="22"/><circle cx="317" cy="250" r="22"/>
    </g>
    <g transform="translate(300,250)">
      <rect x="-11" y="-2" width="22" height="18" rx="3" fill="#2980b9"/>
      <path d="M-7 -2 V-9 a7 7 0 0 1 14 0 V-2" fill="none" stroke="#eaf2f8" stroke-width="2.4"/>
    </g>
    <text x="300" y="330" text-anchor="middle" fill="#d6e9f7" font-size="12.5" font-weight="bold">Ciclo contínuo</text>
    <text x="300" y="352" text-anchor="middle" fill="#8aa6b8" font-size="11">Pipeline seguro</text>
    <text x="300" y="372" text-anchor="middle" fill="#8aa6b8" font-size="11">IAM · Safetensors</text>
    <text x="300" y="392" text-anchor="middle" fill="#8aa6b8" font-size="11">Automação</text>
  </g>

  <!-- Pilar 3: IA / MLSecOps -->
  <g>
    <rect x="390" y="150" width="150" height="300" rx="14" fill="#140e22" stroke="#8e44ad" stroke-width="2"/>
    <rect x="390" y="150" width="150" height="40" rx="14" fill="#8e44ad"/>
    <text x="465" y="177" text-anchor="middle" fill="#1c0f2c" font-size="14" font-weight="bold">DEFESA DE IA</text>
    <!-- rede neural -->
    <g transform="translate(465,252)">
      <g stroke="#9b59b6" stroke-width="1.4" opacity="0.85">
        <line x1="-34" y1="-22" x2="0" y2="0"/><line x1="-34" y1="0" x2="0" y2="0"/><line x1="-34" y1="22" x2="0" y2="0"/>
        <line x1="0" y1="0" x2="34" y2="-16"/><line x1="0" y1="0" x2="34" y2="16"/>
      </g>
      <g fill="#2980b9"><circle cx="-34" cy="-22" r="5"/><circle cx="-34" cy="0" r="5"/><circle cx="-34" cy="22" r="5"/></g>
      <circle cx="0" cy="0" r="7" fill="#9b59b6"/>
      <g fill="#c39bd3"><circle cx="34" cy="-16" r="5"/><circle cx="34" cy="16" r="5"/></g>
    </g>
    <text x="465" y="330" text-anchor="middle" fill="#e8d6f2" font-size="12.5" font-weight="bold">Guardrails</text>
    <text x="465" y="352" text-anchor="middle" fill="#8aa6b8" font-size="11">Treino adversarial</text>
    <text x="465" y="372" text-anchor="middle" fill="#8aa6b8" font-size="11">Anti-poisoning</text>
    <text x="465" y="392" text-anchor="middle" fill="#8aa6b8" font-size="11">Governança</text>
  </g>

  <!-- título -->
  <text x="300" y="516" text-anchor="middle" fill="#8aa6b8" font-size="14" letter-spacing="6">GUIA DEFINITIVO DE</text>
  <text x="300" y="572" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="bold">Kali Linux</text>
  <text x="300" y="616" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="bold">Ethical Hacking</text>
  <text x="300" y="656" text-anchor="middle" fill="#16a085" font-size="28" font-weight="bold">&amp; Defesa de IA</text>

  <line x1="160" y1="686" x2="440" y2="686" stroke="url(#barC)" stroke-width="2"/>
  <text x="300" y="720" text-anchor="middle" fill="#cfe0ee" font-size="14">Da mente do invasor à proteção de redes, sistemas e modelos</text>
  <text x="300" y="742" text-anchor="middle" fill="#8aa6b8" font-size="12.5">15 capítulos · 5 partes · redes, exploração e MLSecOps</text>

  <text x="300" y="796" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Damião dos Santos</text>
  <text x="300" y="818" text-anchor="middle" fill="#8aa6b8" font-size="11.5">Analista de Sistemas · Pós em Segurança da Informação e Engenharia de Software</text>
</svg>
