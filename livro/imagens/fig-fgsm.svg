<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'DejaVu Sans', Arial, sans-serif">
  <style>
    .cap{font-size:12px;fill:#2c3e50;text-anchor:middle}
    .big{font-size:26px;font-weight:bold;fill:#2c3e50;text-anchor:middle}
    .mono{font-family:'DejaVu Sans Mono',monospace;font-size:13px;fill:#1a3a55}
  </style>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1a3a55">Ataque adversarial (FGSM): ruído calculado, não aleatório</text>

  <!-- X -->
  <rect x="40" y="70" width="110" height="110" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="95" y="130" class="big">🐼</text>
  <text x="95" y="200" class="cap">X (original)</text>
  <text x="95" y="218" class="cap" fill="#16a085">"panda" 57%</text>

  <text x="178" y="130" class="big">+</text>

  <!-- delta -->
  <rect x="205" y="70" width="110" height="110" rx="8" fill="#2c3e50" stroke="#c0392b" stroke-width="2"/>
  <g stroke="#7f8c8d" stroke-width="1" opacity="0.6">
    <line x1="212" y1="80" x2="308" y2="92"/><line x1="212" y1="110" x2="308" y2="98"/>
    <line x1="212" y1="140" x2="308" y2="150"/><line x1="212" y1="170" x2="308" y2="130"/>
  </g>
  <text x="260" y="130" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="bold">δ</text>
  <text x="260" y="200" class="cap">perturbação</text>
  <text x="260" y="218" class="cap" fill="#c0392b">imperceptível</text>

  <text x="343" y="130" class="big">=</text>

  <!-- X' -->
  <rect x="370" y="70" width="110" height="110" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="425" y="130" class="big">🐼</text>
  <text x="425" y="200" class="cap">X' (adversarial)</text>
  <text x="425" y="218" class="cap" fill="#c0392b">"gibão" 99% ✗</text>

  <!-- fórmula -->
  <rect x="510" y="70" width="230" height="148" rx="10" fill="#f4f7fa" stroke="#2c3e50" stroke-width="1.4"/>
  <text x="625" y="98" class="cap" font-weight="bold" fill="#1a3a55">Fast Gradient Sign Method</text>
  <text x="525" y="132" class="mono">X' = X + ε·sign(∇ₓ J)</text>
  <text x="525" y="162" font-size="11.5" fill="#5d6d7e">∇ₓ J = gradiente da perda</text>
  <text x="525" y="179" font-size="11.5" fill="#5d6d7e">em relação à ENTRADA</text>
  <text x="525" y="201" font-size="11.5" fill="#c0392b">(no treino: em relação aos pesos)</text>

  <text x="40" y="256" class="cap" style="text-anchor:start" fill="#5d6d7e">Ruído aleatório quase nunca engana o modelo. A perturbação é calculada na direção que MAXIMIZA o erro —</text>
  <text x="40" y="274" class="cap" style="text-anchor:start" fill="#5d6d7e">a mesma matemática do treino, virada ao contrário. Caixa-preta é viável por transferibilidade.</text>
</svg>
