<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'DejaVu Sans', Arial, sans-serif">
  <style>
    .t{font-size:17px;font-weight:bold;fill:#fff}
    .d{font-size:12.5px;fill:#2c3e50}
    .cap{font-size:12px;fill:#5d6d7e}
    .num{font-size:30px;font-weight:bold;fill:#ffffff;opacity:0.35}
  </style>
  <defs>
    <marker id="a2" markerWidth="14" markerHeight="14" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8e44ad"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1a3a55">A Técnica dos Três Pontos — o esqueleto de toda operação ofensiva</text>

  <!-- ponto 1 -->
  <rect x="24" y="64" width="216" height="150" rx="12" fill="#2980b9"/>
  <text x="210" y="104" text-anchor="end" class="num">1</text>
  <text x="44" y="100" class="t">IP</text>
  <text x="44" y="126" class="d" fill="#eaf4fb">Reconhecimento</text>
  <text x="44" y="146" class="d" fill="#eaf4fb">e descoberta</text>
  <text x="44" y="176" class="cap" fill="#d6e9f7">Quais máquinas,</text>
  <text x="44" y="194" class="cap" fill="#d6e9f7">dentro do escopo,</text>
  <text x="44" y="212" class="cap" fill="#d6e9f7">estão vivas?</text>

  <line x1="244" y1="139" x2="270" y2="139" stroke="#8e44ad" stroke-width="3" marker-end="url(#a2)"/>

  <!-- ponto 2 -->
  <rect x="276" y="64" width="216" height="150" rx="12" fill="#1f618d"/>
  <text x="462" y="104" text-anchor="end" class="num">2</text>
  <text x="296" y="100" class="t">PORTAS</text>
  <text x="296" y="126" class="d" fill="#eaf4fb">Mapeamento de</text>
  <text x="296" y="146" class="d" fill="#eaf4fb">serviços (Nmap)</text>
  <text x="296" y="176" class="cap" fill="#d6e9f7">O que cada host</text>
  <text x="296" y="194" class="cap" fill="#d6e9f7">oferece? Serviço,</text>
  <text x="296" y="212" class="cap" fill="#d6e9f7">versão, SO.</text>

  <line x1="496" y1="139" x2="522" y2="139" stroke="#8e44ad" stroke-width="3" marker-end="url(#a2)"/>

  <!-- ponto 3 -->
  <rect x="528" y="64" width="216" height="150" rx="12" fill="#c0392b"/>
  <text x="714" y="104" text-anchor="end" class="num">3</text>
  <text x="548" y="100" class="t">FALHA</text>
  <text x="548" y="126" class="d" fill="#fbe6e3">Análise de</text>
  <text x="548" y="146" class="d" fill="#fbe6e3">vulnerabilidades</text>
  <text x="548" y="176" class="cap" fill="#f6d2cc">Qual versão/config</text>
  <text x="548" y="194" class="cap" fill="#f6d2cc">é explorável?</text>
  <text x="548" y="212" class="cap" fill="#f6d2cc">CVE · CVSS · exploit</text>

  <text x="20" y="252" class="cap">Oportunista ou dirigido, todo ataque passa por estes três pontos — muda só o esforço em cada um.</text>
  <text x="20" y="276" class="cap" fill="#16a085">Na Parte V, a mesma lógica reaparece: superfície (IP→API), mapeamento (modelo/dados) e falha (injeção/adversarial).</text>
</svg>
