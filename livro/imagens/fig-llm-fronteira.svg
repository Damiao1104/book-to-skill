<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'DejaVu Sans', Arial, sans-serif">
  <style>
    .t{font-size:15px;font-weight:bold;fill:#1a3a55}
    .b{font-size:12.5px;fill:#fff;font-weight:bold}
    .cap{font-size:12px;fill:#5d6d7e}
  </style>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1a3a55">A falha estrutural do LLM: a fronteira entre código e dados some</text>

  <!-- SQL -->
  <text x="190" y="64" text-anchor="middle" class="t">SQL — fronteira preservada</text>
  <rect x="40" y="80" width="140" height="48" rx="6" fill="#2c3e50"/>
  <text x="110" y="109" text-anchor="middle" class="b">código fixo</text>
  <rect x="210" y="80" width="140" height="48" rx="6" fill="#16a085"/>
  <text x="280" y="109" text-anchor="middle" class="b">dado do usuário</text>
  <line x1="195" y1="72" x2="195" y2="136" stroke="#16a085" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="195" y="154" text-anchor="middle" class="cap" fill="#16a085">prepared statement: "isto é dado, nunca comando"</text>
  <text x="195" y="174" text-anchor="middle" class="cap">a fronteira é garantida</text>

  <!-- LLM -->
  <text x="565" y="64" text-anchor="middle" class="t" fill="#c0392b">LLM — fronteira quebrada</text>
  <rect x="400" y="80" width="330" height="48" rx="6" fill="url(#mix)"/>
  <defs>
    <linearGradient id="mix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="0.5" stop-color="#7b5aa6"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <text x="565" y="103" text-anchor="middle" class="b">instrução do sistema + dado do usuário</text>
  <text x="565" y="120" text-anchor="middle" fill="#fff" font-size="11">um único fluxo de tokens</text>
  <text x="565" y="154" text-anchor="middle" class="cap" fill="#c0392b">sem fronteira forte — não sabe DE QUEM veio a instrução</text>
  <text x="565" y="174" text-anchor="middle" class="cap">não há "prepared statement" perfeito (ainda)</text>

  <!-- conclusão -->
  <rect x="40" y="206" width="690" height="100" rx="10" fill="#fef5e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="60" y="234" font-size="13.5" font-weight="bold" fill="#b9770e">Prompt Injection = o "SQL Injection da era dos LLMs"</text>
  <text x="60" y="260" class="cap">SQLi: dado vira comando SQL  →  defesa: prepared statement (restabelece a fronteira).</text>
  <text x="60" y="282" class="cap">Prompt Injection: dado vira instrução ao modelo  →  defesa: guardrails + menor privilégio + HITL.</text>
  <text x="60" y="300" class="cap" fill="#c0392b">(defesa em camadas, probabilística — não uma barreira absoluta).</text>
</svg>
