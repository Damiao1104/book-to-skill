<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'DejaVu Sans', Arial, sans-serif">
  <style>.t{font-size:13px;font-weight:bold;fill:#2c3e50}.c{font-size:11.5px;fill:#5d6d7e}.lab{font-size:12px;font-weight:bold;fill:#fff}</style>
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2980b9"/><stop offset="0.5" stop-color="#8e44ad"/><stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1a3a55">O SOC do futuro: graduar a autonomia pelo impacto e pela reversibilidade</text>

  <!-- barra espectro -->
  <rect x="40" y="70" width="680" height="26" rx="13" fill="url(#spec)"/>
  <text x="40" y="118" class="t">manual</text>
  <text x="380" y="118" text-anchor="middle" class="t">máquina sugere, humano aprova (HITL)</text>
  <text x="720" y="118" text-anchor="end" class="t">autônomo</text>
  <polygon points="40,70 40,96 30,83" fill="#2980b9"/>
  <polygon points="720,70 720,96 730,83" fill="#c0392b"/>

  <!-- três colunas -->
  <rect x="40" y="140" width="210" height="118" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.4"/>
  <rect x="40" y="140" width="210" height="28" rx="10" fill="#2980b9"/>
  <text x="145" y="159" text-anchor="middle" class="lab">Baixo impacto / reversível</text>
  <text x="56" y="192" class="c">bloquear um IP por 10 min,</text>
  <text x="56" y="210" class="c">rate limit temporário,</text>
  <text x="56" y="228" class="c">isolar host de teste.</text>
  <text x="56" y="250" class="t" fill="#2980b9" font-size="12">→ pode ser autônomo</text>

  <rect x="275" y="140" width="210" height="118" rx="10" fill="#f6f1fa" stroke="#8e44ad" stroke-width="1.4"/>
  <rect x="275" y="140" width="210" height="28" rx="10" fill="#8e44ad"/>
  <text x="380" y="159" text-anchor="middle" class="lab">Impacto médio</text>
  <text x="291" y="192" class="c">revogar uma credencial,</text>
  <text x="291" y="210" class="c">quarentena de e-mail,</text>
  <text x="291" y="228" class="c">derrubar sessão suspeita.</text>
  <text x="291" y="250" class="t" fill="#8e44ad" font-size="12">→ sugerir + aprovação</text>

  <rect x="510" y="140" width="210" height="118" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
  <rect x="510" y="140" width="210" height="28" rx="10" fill="#c0392b"/>
  <text x="615" y="159" text-anchor="middle" class="lab">Alto impacto / irreversível</text>
  <text x="526" y="192" class="c">derrubar produção,</text>
  <text x="526" y="210" class="c">revogar acessos em massa,</text>
  <text x="526" y="228" class="c">apagar/bloquear em larga escala.</text>
  <text x="526" y="250" class="t" fill="#c0392b" font-size="12">→ exige humano (HITL)</text>

  <text x="40" y="282" class="c">⚠ Sem graduar por impacto, a resposta autônoma vira DoS auto-infligido via falsos positivos.</text>
</svg>
