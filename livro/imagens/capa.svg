<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 849" width="600" height="849" font-family="'DejaVu Sans', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b2b"/>
      <stop offset="0.55" stop-color="#132a40"/>
      <stop offset="1" stop-color="#1a3a55"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a085"/>
      <stop offset="1" stop-color="#2980b9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2980b9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2980b9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="849" fill="url(#bg)"/>
  <circle cx="300" cy="430" r="260" fill="url(#glow)"/>

  <!-- circuito decorativo superior -->
  <g stroke="#2980b9" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M40 70 H180 V120 H300"/>
    <path d="M560 60 H420 V110 H330"/>
    <path d="M40 130 H120 V180"/>
    <circle cx="300" cy="120" r="4" fill="#16a085" stroke="none"/>
    <circle cx="330" cy="110" r="4" fill="#16a085" stroke="none"/>
    <circle cx="120" cy="180" r="4" fill="#16a085" stroke="none"/>
  </g>

  <!-- emblema: escudo + nós de IA -->
  <g transform="translate(300,300)">
    <path d="M0 -92 L78 -58 V6 C78 56 44 92 0 112 C-44 92 -78 56 -78 6 V-58 Z"
          fill="#0e2234" stroke="url(#line)" stroke-width="3"/>
    <!-- terminal/prompt -->
    <rect x="-46" y="-44" width="92" height="60" rx="6" fill="#06151f" stroke="#16a085" stroke-width="1.5"/>
    <text x="-38" y="-20" font-size="15" fill="#16a085" font-family="'DejaVu Sans Mono', monospace">&gt;_</text>
    <rect x="-16" y="-25" width="34" height="3" fill="#2980b9"/>
    <!-- nós neurais -->
    <g stroke="#2980b9" stroke-width="1.4" opacity="0.9">
      <line x1="-30" y1="46" x2="0" y2="66"/><line x1="0" y1="46" x2="0" y2="66"/><line x1="30" y1="46" x2="0" y2="66"/>
      <line x1="-30" y1="46" x2="-30" y2="30"/><line x1="0" y1="46" x2="0" y2="30"/><line x1="30" y1="46" x2="30" y2="30"/>
    </g>
    <g fill="#16a085">
      <circle cx="-30" cy="46" r="6"/><circle cx="0" cy="46" r="6"/><circle cx="30" cy="46" r="6"/>
      <circle cx="0" cy="66" r="7" fill="#2980b9"/>
      <circle cx="-30" cy="30" r="4"/><circle cx="0" cy="30" r="4"/><circle cx="30" cy="30" r="4"/>
    </g>
  </g>

  <!-- faixa de título -->
  <text x="300" y="488" text-anchor="middle" fill="#8fb8d6" font-size="15" letter-spacing="6">GUIA DEFINITIVO DE</text>

  <text x="300" y="548" text-anchor="middle" fill="#ffffff" font-size="46" font-weight="bold">Kali Linux</text>
  <text x="300" y="598" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">Ethical Hacking</text>
  <text x="300" y="640" text-anchor="middle" fill="#16a085" font-size="30" font-weight="bold">&amp; Defesa de IA</text>

  <line x1="150" y1="672" x2="450" y2="672" stroke="url(#line)" stroke-width="2"/>

  <text x="300" y="708" text-anchor="middle" fill="#cfe0ee" font-size="14">Da mente do invasor à proteção de redes, sistemas e modelos</text>
  <text x="300" y="730" text-anchor="middle" fill="#8fb8d6" font-size="13">Pentest · MLSecOps · Guardrails · Governança (NIST AI RMF · EU AI Act)</text>

  <!-- rodapé autor -->
  <text x="300" y="792" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">[Autor]</text>
  <text x="300" y="814" text-anchor="middle" fill="#8fb8d6" font-size="11.5">Analista de Sistemas · Pós em Segurança da Informação e Engenharia de Software</text>
</svg>
